<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Guessing Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }
        .card {
            margin-top: 80px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card p-4 w-100" style="max-width: 500px;">
            <h1 class="text-center mb-4">🎯 Guess the Number</h1>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">First Number (Range Start)</label>
                    <input type="number" name="num1" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Second Number (Range End)</label>
                    <input type="number" name="num2" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Your Guess</label>
                    <input type="number" name="guess" class="form-control" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Submit Guess</button>
                </div>
            </form>

            {% if result %}
                <div class="alert alert-info text-center mt-4">
                    <strong>{{ result }}</strong><br>
                    <small>The correct number was: <strong>{{ answer }}</strong></small>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
